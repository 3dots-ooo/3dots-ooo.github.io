<header class="site-header" data-header>

      <span data-nav-label>Menu</span>
      <span class="toggle-dots" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
    <nav class="site-nav" id="site-nav" aria-label="Main">
      <ul>
        <li><a href="{{ '/#about-us' | relative_url }}">About</a></li>
        <li><a href="{{ '/#services' | relative_url }}">Services</a></li>
        <li><a href="{{ '/projects/' | relative_url }}"{% if page.url contains '/projects/' %} aria-current="true"{% endif %}>Projects</a></li>
        <li><a href="{{ '/whatson/' | relative_url }}"{% if page.url contains '/whatson/' %} aria-current="true"{% endif %}>What’s On</a></li>

      </ul>
    </nav>
