intro: Through **policy making**, **ecosystem building**, and **innovative finance**, we design the conditions for culture to thrive.
headline: Let’s choose to invest in creativity
hero_image: https://images.squarespace-cdn.com/content/v1/68f893344fb5c35a978251f4/1761595057838-779DK4UDR7OQAW6C80RN/unsplash-image-M7lpPP9MnwE.jpg?format=2500w
about: |
  As entrepreneurs ourselves, we are always on the lookout for the next challenges and the people who are eager to solve them. Collaboration is at the heart of our work, and we believe in doing it boldly. Being practitioners rather than just dreamers, it is our pure intention to design hands-on processes.

  Because our world changes so quickly, we need challengers who constantly learn and develop new skills to thrive in uncertain times. Motivation to co-create unifies and provides us with an outlet for creativity in order to overcome today’s challenges by preparing for tomorrow’s opportunities.
services_heading: We connect creative vision with the resources & effort needed to make it a reality.
services:
  - title: Policy & Research
    text: We shape cultural strategies, produce evidence-based analysis, and contribute to policymaking that reflects the realities of creative work.
  - title: Ecosystem Building
    text: From community programs to institutional collaborations, we design frameworks that strengthen the conditions for cultural practices to grow.
  - title: Investment & Funds
    text: We create and pilot alternative funding models — including grants, recoverable finance, and hybrid tools — tailored for the creative economy.
cfs:
  title: Culture Finance Standard
  lead: Our years of work exploring **new financial approaches in culture** have finally come to life in 2026.
  statements:
    - "**Climate** has its standards."
    - "**Social** has its measurement."
    - "**Cultural value** is the largest unmeasured category in sustainability finance."
  closing: Now, we’re building the **third.** Please visit [www.culturefinancestandard.com](https://www.culturefinancestandard.com) and contact us if you’d like to be involved.
